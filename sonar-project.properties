sonar.projectKey=bolorundurovj_LagosFile
sonar.organization=bolorundurovj

sonar.projectName=LagosFile
sonar.projectVersion=1.0.0

# Paths
sonar.sources=src,extension/chrome,extension/firefox,src-tauri/src
sonar.tests=src,extension/tests,src-tauri/tests
sonar.test.inclusions=src/**/*.spec.ts,extension/tests/**,src-tauri/tests/**
# Firefox scripts identical to the Chrome ones are excluded; extension/tests/firefox-parity.test.mjs enforces they stay identical.
sonar.exclusions=src-tauri/target/**,node_modules/**,dist/**,dist-ext/**,src/**/*.spec.ts,extension/firefox/autofill-core.js,extension/firefox/content-script.js,extension/firefox/popup.js,extension/firefox/token-capture.js,extension/firefox/popup.html,extension/firefox/popup.css

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=coverage/lagosfile/lcov.info,coverage/extension/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Rust
sonar.rust.cargoManifestPath=src-tauri/Cargo.toml
sonar.rust.lcov.reportPaths=src-tauri/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
