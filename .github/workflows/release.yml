name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and publish (e.g. v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.tag }}

jobs:
  # ── 1. Build browser extensions ───────────────────────────────
  build-extensions:
    name: Build browser extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack Chrome extension
        run: npm run pack:ext:chrome

      - name: Pack Firefox extension
        run: npm run pack:ext:firefox

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: ext-chrome
          path: dist-ext/chrome-lagosfile-lirs.zip

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: ext-firefox
          path: dist-ext/firefox-lagosfile-lirs.xpi

  # ── 2. Build Tauri app (matrix: all platforms) ─────────────────
  build-tauri:
    name: Build Tauri (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            # MSI rejects versions like 1.3.0-beta.1
            beta_args: '--bundles nsis'

          - name: macOS (Intel)
            os: macos-15-intel
            args: '--target x86_64-apple-darwin'

          - name: macOS (Apple Silicon)
            os: macos-latest
            args: '--target aarch64-apple-darwin'

          - name: Linux
            os: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional - set these secrets to enable)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ contains(inputs.tag, '-') && matrix.beta_args || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn

  # ── 3. Build custom Windows installer (PolyInstall) ────────────
  build-installer:
    name: Build Windows installer (PolyInstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: polyinstall-windows

      # Builds the Angular frontend (via beforeBuildCommand) and the Tauri
      # binary, skipping the native bundlers; only LagosFile.exe is needed.
      - name: Build Tauri binary (no bundle)
        run: npm run tauri -- build --no-bundle

      - name: Resolve app version
        shell: bash
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "LAGOSFILE_VERSION=$VER" >> "$GITHUB_ENV"

      # Keep the bundled EULA in sync with the canonical LICENSE.
      - name: Stage license into payload
        shell: bash
        run: cp LICENSE installer/payload/LICENSE.txt

      - name: Set up PolyInstall
        uses: bolorundurowb/PolyInstall/.github/actions/setup-polyinstall@v2.0.0
        with:
          version: v2.0.0
          rid: win-x64

      - name: Build installer
        shell: bash
        run: |
          polyinstall build installer/lagosfile.polyinstall.yaml \
            --base . \
            --output-manifest build-manifest.json
          cat build-manifest.json

      - name: Rename output
        id: rename
        shell: bash
        run: |
          OUT="dist-installer/LagosFile-${LAGOSFILE_VERSION}-windows-x64-installer.exe"
          mv dist-installer/LagosFile-windows-x64.exe "$OUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.rename.outputs.asset }}
          if-no-files-found: error

  # ── 4. Publish GitHub Release ──────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-tauri, build-extensions, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Set up Node for notice generation
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install cargo-license
        run: cargo install cargo-license --locked

      - name: Generate third-party notices
        run: npm run generate:notices

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: LagosFile ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
          files: |
            artifacts/tauri-*/**/*.msi
            artifacts/tauri-*/**/*.exe
            artifacts/tauri-*/**/*.dmg
            artifacts/tauri-*/**/*.deb
            artifacts/tauri-*/**/*.AppImage
            artifacts/windows-installer/*.exe
            artifacts/ext-chrome/chrome-lagosfile-lirs.zip
            artifacts/ext-firefox/firefox-lagosfile-lirs.xpi
            THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
