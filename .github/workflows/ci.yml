name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect VERSION.ini change (master push only)
  check-version:
    name: Check VERSION.ini
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if VERSION.ini changed
        id: diff
        run: |
          if git diff HEAD^ HEAD -- VERSION.ini | grep -qE '^\+[^+]'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 20

      - name: Assemble version from VERSION.ini
        id: read
        if: steps.diff.outputs.changed == 'true'
        run: |
          VERSION=$(node -e "
            const fs = require('fs');
            const src = fs.readFileSync('VERSION.ini', 'utf8');
            const fields = {};
            for (const line of src.split('\n')) {
              const t = line.trim();
              if (!t || t.startsWith('#')) continue;
              const eq = t.indexOf('=');
              if (eq === -1) continue;
              fields[t.slice(0, eq).trim()] = t.slice(eq + 1).trim();
            }
            const { MAJOR, MINOR, PATCH, PRE_RELEASE } = fields;
            const base = MAJOR + '.' + MINOR + '.' + PATCH;
            console.log(PRE_RELEASE ? base + '-' + PRE_RELEASE : base);
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Sync all version files and cut tag
  cut-release:
    name: Sync versions and cut tag
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync version across all files
        run: node scripts/sync-version.mjs

      - name: Commit synced versions and cut tag
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}

          # Only commit if the sync script actually changed files
          if ! git diff --quiet; then
            git add \
              package.json \
              src-tauri/tauri.conf.json \
              src-tauri/Cargo.toml \
              src-tauri/Cargo.lock \
              extension/chrome/manifest.json \
              extension/firefox/manifest.json
            git commit -m 'chore(release): sync version files to ${{ needs.check-version.outputs.version }}'
            git push origin HEAD:master
          fi

          # Tag the current HEAD (guaranteed to include the synced versions)
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

  # Angular lint & build
  angular:
    name: Angular lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Angular
        run: npm run lint

      - name: Audit Node dependencies
        # All vulnerable packages (serialize-javascript, tar, uuid) are devDependencies
        # inside Angular CLI / webpack build tooling -- they are never shipped in the
        # app bundle. --omit=dev audits production deps only.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Angular
        run: npm run build

  # Angular tests
  angular-test:
    name: Angular tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Angular
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/lagosfile

  # Rust lint & check
  rust:
    name: Rust lint & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-v3

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Rust tests
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-v3

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate backend coverage
        working-directory: src-tauri
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src-tauri/lcov.info

  # Extension pack check
  extension:
    name: Extension pack check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack extensions
        run: npm run pack:ext
