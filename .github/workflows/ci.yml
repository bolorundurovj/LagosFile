name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Angular lint & build
  angular:
    name: Angular lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Angular
        run: npm run lint

      - name: Audit Node dependencies
        # All vulnerable packages (serialize-javascript, tar, uuid) are devDependencies
        # inside Angular CLI / webpack build tooling -- they are never shipped in the
        # app bundle. --omit=dev audits production deps only.
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Angular
        run: npm run build

  # Angular tests
  angular-test:
    name: Angular tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Angular
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/lagosfile

  # Rust lint & check
  rust:
    name: Rust lint & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-v3

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Rust tests
  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-v3

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies for PAYE cross-check
        run: npm ci

      - name: Cross-check Rust engine against nigeria-paye
        run: npm run test:paye

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate backend coverage
        working-directory: src-tauri
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: src-tauri/lcov.info

  # Extension pack check
  extension:
    name: Extension pack check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test extensions
        run: npm run test:ext

      - name: Pack extensions
        run: npm run pack:ext

  # Release PRs: betas on develop, stable on master
  release-please:
    name: Release PR
    needs: [angular, angular-test, rust, rust-test, extension]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install release-please
        run: npm install --prefix "$RUNNER_TEMP/release-please" --ignore-scripts --no-audit --no-fund release-please@17.11.2

      - name: Update release PR or create release
        id: release
        run: node scripts/release-please.cjs
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_PLEASE_DIR: ${{ runner.temp }}/release-please

  publish:
    name: Publish release
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  # develop needs each stable version to pick the next beta number
  back-merge:
    name: Open master to develop PR
    needs: release-please
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.release-please.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Open back-merge PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          open=$(gh pr list --base develop --head master --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh pr create --base develop --head master --title "chore: merge $TAG back into develop" --body "Merge with a merge commit. Squashing or rebasing hides the release tag from develop."
          fi
