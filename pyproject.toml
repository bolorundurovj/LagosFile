[tool.poetry]
name = "lagosfile"
version = "0.1.0"
description = "LagosFile desktop application for tax filing"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "lagosfile"}]

[tool.poetry.dependencies]
python = "^3.10"
flet = "^0.83.1"
tortoise-orm = "^1.1.7"
cryptography = "^46.0.6"
httpx = "^0.28.1"
reportlab = "^4.4.10"
hypothesis = "^6.151.10"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pydantic = "^2.12.5"
tzdata = "^2026.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.1.2"
ruff = "^0.9.10"
pre-commit = "^4.1.0"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C", "S", "UP"]
ignore = ["E501", "S110", "S603", "S606", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["lagosfile"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"lagosfile/tests/**" = ["S101"]
"test_simple.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["lagosfile/tests"]
asyncio_mode = "auto"
addopts = "-v"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hypothesis]
deadline = 500  # Increase deadline for slower tests
