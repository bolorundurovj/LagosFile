# ─────────────────────────────────────────────────────────────────────────────
# LagosFile — Version Declaration
# ─────────────────────────────────────────────────────────────────────────────
#
# Edit this file to trigger a release. Push to master and CI will:
#   1. Assemble the version string from the fields below
#   2. Sync it to package.json, tauri.conf.json, Cargo.toml , and both
#      extension manifests
#   3. Create and push the git tag  ->  release pipeline runs automatically
#
# ─────────────────────────────────────────────────────────────────────────────
# VERSIONING RULES  (semver.org)
#
# MAJOR  Increment for breaking changes that are not backwards compatible.
#        When you bump MAJOR, reset MINOR and PATCH to 0.
#        Example:  1.4.2  ->  2.0.0
#
# MINOR  Increment for new features that are backwards compatible.
#        When you bump MINOR, reset PATCH to 0. Leave MAJOR unchanged.
#        Example:  1.4.2  ->  1.5.0
#
# PATCH  Increment for backwards-compatible bug fixes only.
#        No resets needed.
#        Example:  1.4.2  ->  1.4.3
#
# PRE_RELEASE  Optional label appended after a hyphen.
#              Leave blank for a stable release.
#              Common patterns:
#                alpha.1   ->  early internal preview
#                beta.1    ->  feature-complete but not fully tested
#                rc.1      ->  release candidate, final testing only
#              On GitHub, any release with a PRE_RELEASE value is marked as
#              a pre-release and will not appear as the "Latest" release.
#              Example:  1.1.0-beta.1
#              Set to empty for stable:  1.1.0
#
# ─────────────────────────────────────────────────────────────────────────────

MAJOR=1
MINOR=1
PATCH=1
PRE_RELEASE=
